<body data-theme="classic">
  <main class="app">
    <header class="topbar"><div class="brand-mark">⛳</div><div class="brand"><h1>PLAY NINE <span class="version">v1.6.1</span></h1><small>Three players · nine holes · lowest score wins</small></div><i class="spacer"></i><div class="top-actions"><button class="btn small" id="settingsButton">Settings</button></div></header>
    <div class="layout">
      <aside class="sidebar">
        <section class="panel hole-panel"><div class="eyebrow">Hole</div><div class="hole-value" id="holeValue">Waiting</div><div class="hole-detail" id="holeDetail">Eight cards · two rows of four</div></section>
        <section class="panel scoreboard"><div class="panel-heading">Score · low wins</div><div id="scoreRows"></div></section>
        <section class="panel history"><div class="panel-heading">Scorecard</div><div id="historyRows"><div class="empty">No holes scored.</div></div></section>
        <div class="side-actions"><button class="btn danger" id="newGameButton">Start Game</button><div class="notice" id="teeNotice" hidden></div></div>
        <section class="panel achievements"><div class="panel-heading">Game Achievements</div><div class="achievement-header"><span>Name</span><span>−5</span><span>−10</span><span>1st</span></div><div id="achievementRows"></div></section>
      </aside>
      <section class="table">
        <div class="turn-note" id="turnNote">Choose a player to begin.</div><div class="round-event" id="roundEvent" hidden></div>
        <div class="player-area p1" id="area1"><div class="player-chip"><img class="avatar" src="/cristi-avatar.png" alt="Cristi"><div class="player-copy"><div class="player-name">Cristi<button class="name-edit" id="editName1" type="button" hidden>✎</button></div><div class="player-detail" id="detail1">Waiting</div></div></div><div class="golf-grid" id="board1"></div></div>
        <div class="player-area p2" id="area2"><div class="player-chip"><img class="avatar" src="/cindy-avatar.png" alt="Cindy"><div class="player-copy"><div class="player-name">Cindy<button class="name-edit" id="editName2" type="button" hidden>✎</button></div><div class="player-detail" id="detail2">Waiting</div></div></div><div class="golf-grid" id="board2"></div></div>
        <div class="center"><div class="pile-wrap"><button class="pile" id="stockPile"><span class="pile-back">⛳</span><span class="pile-count" id="stockCount">0</span></button><div class="pile-label">Draw pile</div></div><div class="pile-wrap"><button class="pile" id="discardPile"></button><div class="pile-label">Discard</div></div><div class="pile-actions"><button class="btn discard-drawn" id="discardDrawnButton" hidden>Discard drawn card &amp; flip</button></div></div>
        <div class="player-area p0" id="area0"><div class="player-chip"><img class="avatar" src="/daryl-avatar.png" alt="Daryl"><div class="player-copy"><div class="player-name">Daryl<button class="name-edit" id="editName0" type="button" hidden>✎</button></div><div class="player-detail" id="detail0">Waiting</div></div></div><div class="golf-grid" id="board0"></div></div>
      </section>
    </div>
  </main>
  <div class="backdrop" id="backdrop"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div><button class="btn return" id="gameNightReturn">← Game Night</button>
  <script>
    const PLAYER_NAMES=["Daryl","Cristi","Cindy"],SESSION_KEY="playNineSession",PREF_KEY="playNinePreferences";
    const API=location.protocol==="file:"?"http://127.0.0.1:8080":"";
    const state={token:null,seat:-1,name:null,data:null,poll:null,heartbeat:null,busy:false,flipMode:false,lastHoleShown:0,lastCloser:null,pendingHoleKey:null,holeScoreTimer:null};
    const prefs=Object.assign({theme:"classic",sound:true,botLevel:"medium"},JSON.parse(localStorage.getItem(PREF_KEY)||"null")||{});document.body.dataset.theme=prefs.theme;
    const $=selector=>document.querySelector(selector),escapeHtml=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));

    function openModal(html){$("#modal").innerHTML=html;$("#backdrop").classList.add("open")}function closeModal(){$("#backdrop").classList.remove("open");$("#modal").innerHTML=""}
    async function api(path,options={}){const response=await fetch(API+path,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}}),data=await response.json();if(!response.ok||data.ok===false)throw new Error(data.message||"Request failed");return data}
    async function send(action){if(state.busy)return false;state.busy=true;try{const data=await api("/api/action",{method:"POST",body:JSON.stringify({token:state.token,...action})});state.data=data.state;state.flipMode=false;render();return true}catch(error){toast(error.message);return false}finally{state.busy=false}}
    function flyCard(element,toRect,delay=0,keep=false){if(!element||!toRect||matchMedia("(prefers-reduced-motion: reduce)").matches)return Promise.resolve(null);const from=element.getBoundingClientRect(),clone=element.cloneNode(true);clone.removeAttribute("id");clone.querySelector(".pile-count")?.remove();clone.classList.add("card-flight");clone.disabled=true;Object.assign(clone.style,{left:`${from.left}px`,top:`${from.top}px`,width:`${from.width}px`,height:`${from.height}px`});document.body.appendChild(clone);const dx=toRect.left-from.left,dy=toRect.top-from.top,sx=toRect.width/from.width,sy=toRect.height/from.height,animation=clone.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`,opacity:1}],{duration:440,delay,easing:"cubic-bezier(.2,.8,.2,1)",fill:"forwards"});return animation.finished.catch(()=>{}).then(()=>{if(!keep)clone.remove();return keep?clone:null})}
    async function playBoardCard(index){if(state.busy)return;const action=state.flipMode?"discardFlip":"replace",target=$(`#board${state.seat} [data-index="${index}"]`),discard=$("#discardPile"),source=state.data.drawn?.source==="discard"?discard:$("#stockPile"),targetRect=target?.getBoundingClientRect(),discardRect=discard?.getBoundingClientRect();state.busy=true;try{const request=api("/api/action",{method:"POST",body:JSON.stringify({token:state.token,action,index})}),motion=action==="replace"?Promise.all([flyCard(target,discardRect,0,true),flyCard(source,targetRect,55,true)]):Promise.resolve([]),[data,flights]=await Promise.all([request,motion]);state.data=data.state;state.flipMode=false;render();requestAnimationFrame(()=>{flights.filter(Boolean).forEach(card=>card.remove());$(`#board${state.seat} [data-index="${index}"]`)?.classList.add(action==="replace"?"card-land":"card-reveal")})}catch(error){document.querySelectorAll(".card-flight").forEach(card=>card.remove());toast(error.message)}finally{state.busy=false}}
    async function chooseDiscard(s){if(state.busy)return;const stock=$("#stockPile"),discard=$("#discardPile"),destination=discard?.getBoundingClientRect();state.busy=true;try{const request=s.canSkip?api("/api/action",{method:"POST",body:JSON.stringify({token:state.token,action:"skip"})}):Promise.resolve(null),[flight,data]=await Promise.all([flyCard(stock,destination,0,true),request]);if(data){state.data=data.state;state.flipMode=false}else state.flipMode=true;render();requestAnimationFrame(()=>flight?.remove())}catch(error){document.querySelectorAll(".card-flight").forEach(card=>card.remove());toast(error.message)}finally{state.busy=false}}
    function valueLabel(value){return value===-5?"HOLE IN ONE":value===0?"MULLIGAN":value===12?"OUT OF BOUNDS":"STROKES"}
    function cardClass(value){return value===-5?"ace":value===0?"zero":value>=10?"bad":""}
    function faceCard(value,mini=false){return `<span class="${mini?"drawn-mini":"card-value"} ${cardClass(value)}">${value}</span>${mini?"":`<span class="card-label">${valueLabel(value)}</span>`}`}
    function liveMatchInfo(board){const columns=[],byValue=new Map();for(let column=0;column<4;column++){const top=board[column],bottom=board[column+4];if(!top?.faceUp||!bottom?.faceUp||top.value!==bottom.value)continue;columns.push(column);const matches=byValue.get(top.value)||[];matches.push(column);byValue.set(top.value,matches)}const bonusColumns=new Set(),bonusGroups=[];for(const [value,matches] of byValue){if(matches.length<2)continue;matches.forEach(column=>bonusColumns.add(column));bonusGroups.push({value,count:matches.length,bonus:matches.length*-5})}return{columns,bonusColumns,bonus:bonusGroups.reduce((sum,group)=>sum+group.bonus,0)}}
    function renderScores(s){$("#scoreRows").innerHTML=s.seats.map((player,seat)=>`<div class="score-row"><div class="score-name">${escapeHtml(player.name)}<span class="score-note">${player.bot?"Bot":player.connected?"Live":"Waiting"}</span></div><div class="score-number">${s.totals[seat]}</div></div>`).join("")}
    function renderHistory(s){$("#historyRows").innerHTML=s.holeHistory?.length?s.holeHistory.map(hole=>`<div class="history-row"><strong>H${hole.hole}</strong>${hole.results.map(result=>`<span>${result.score>=0?"+":""}${result.score}<br><strong>${hole.totals[result.seat]}</strong></span>`).join("")}</div>`).join(""):'<div class="empty">No holes scored.</div>'}
    function renderAchievements(s){const totals=s.seats.map(()=>({minusFive:0,minusTen:0,firstOut:0}));for(const hole of s.holeHistory||[]){if(Number.isInteger(hole.closer)&&totals[hole.closer])totals[hole.closer].firstOut++;for(const result of hole.results||[]){totals[result.seat].minusFive+=result.minusFivePlayed||0;totals[result.seat].minusTen+=result.minusTenEarned||0}}$("#achievementRows").innerHTML=s.seats.map((player,seat)=>`<div class="achievement-row"><span class="achievement-name">${escapeHtml(player.name)}</span><span class="achievement-stat">${totals[seat].minusFive}</span><span class="achievement-stat">${totals[seat].minusTen}</span><span class="achievement-stat" title="First out">${totals[seat].firstOut}</span></div>`).join("")}
    function editName(current){const name=prompt("Name for this game:",current);if(name===null)return;if(!name.trim())return toast("Enter a player name.");send({action:"rename",name})}
    function renderBoard(s,seat){const board=s.boards[seat]||[],matchInfo=liveMatchInfo(board),matched=new Set(matchInfo.columns),canTee=s.phase==="teeOff"&&seat===state.seat&&(s.teeOffCounts[seat]||0)<2,canPlay=s.phase==="playing"&&s.turn===state.seat&&s.stage==="play"&&seat===state.seat,grid=$("#board"+seat);grid.classList.toggle("double-match",matchInfo.bonus<0);grid.innerHTML=board.map((slot,index)=>{const column=index%4,isMatched=slot.faceUp&&matched.has(column),isBonus=matchInfo.bonusColumns.has(column),actionable=(canTee&&!slot.faceUp)||(canPlay&&(!state.flipMode||!slot.faceUp)),classes=["golf-card",slot.faceUp?cardClass(slot.value):"face-down",actionable?"actionable":"",state.flipMode&&canPlay&&!slot.faceUp?"flip-target":"",isMatched?"matched":"",isMatched&&index>=4?"matched-bottom":"",isBonus?"double-set":""].filter(Boolean).join(" ");return `<button class="${classes}" data-index="${index}" ${actionable?"":"disabled"}>${slot.faceUp?faceCard(slot.value):""}</button>`}).join("");grid.querySelectorAll("button.actionable").forEach(button=>button.onclick=()=>{const index=Number(button.dataset.index);if(canTee)return send({action:"teeOff",index});playBoardCard(index)})}
    function renderPlayers(s){for(let seat=0;seat<3;seat++){const info=s.seats[seat],area=$("#area"+seat),nameNode=area.querySelector(".player-name"),edit=$("#editName"+seat),handScore=s.handScores?.[seat]??0,matchInfo=liveMatchInfo(s.boards[seat]||[]),bonus=matchInfo.bonus<0?` · −${Math.abs(matchInfo.bonus)} bonus`:"";nameNode.firstChild.nodeValue=info.name;area.querySelector(".avatar").alt=info.name;edit.hidden=seat!==state.seat;edit.setAttribute("aria-label",`Edit ${info.name}'s name`);edit.onclick=()=>editName(info.name);area.classList.toggle("active",s.phase==="playing"&&s.turn===seat);area.classList.toggle("closer",s.closer===seat);$("#detail"+seat).textContent=s.closer===seat?`PUTTED OUT · ${handScore} hand${bonus}`:s.phase==="teeOff"?`${s.teeOffCounts[seat]}/2 flipped · ${handScore} hand${bonus}`:`${info.bot?"Bot":info.connected?"Live":"Waiting"} · ${handScore} hand${bonus}`;renderBoard(s,seat)}}
    function renderCenter(s){const stock=$("#stockPile"),discard=$("#discardPile"),discardButton=$("#discardDrawnButton"),canDraw=s.phase==="playing"&&s.turn===state.seat&&s.stage==="draw",ownTurn=s.phase==="playing"&&s.turn===state.seat&&s.stage==="play",stockDraw=ownTurn&&s.drawn?.source==="stock",discardDraw=ownTurn&&s.drawn?.source==="discard",showDrawnOnStock=stockDraw&&!state.flipMode,showDrawnOnDiscard=discardDraw||(stockDraw&&state.flipMode),stockValue=showDrawnOnStock?s.drawn.card.value:null,discardValue=showDrawnOnDiscard?s.drawn.card.value:s.discardTop?.value,stockActionable=canDraw||discardDraw,discardActionable=(canDraw&&s.discardTop)||(stockDraw&&!state.flipMode);stock.innerHTML=stockValue!==null?`${faceCard(stockValue)}<span class="pile-count">${s.stockCount}</span>`:`<span class="pile-back">⛳</span><span class="pile-count">${s.stockCount}</span>`;stock.className=`pile ${stockValue!==null?`golf-card ${cardClass(stockValue)} selected`:""} ${stockActionable?"actionable":""}`;stock.disabled=!stockActionable;stock.onclick=canDraw?()=>send({action:"draw",source:"stock"}):discardDraw?()=>send({action:"switchDraw",source:"stock"}):null;discard.innerHTML=discardValue===undefined?"":faceCard(discardValue);discard.className=`pile golf-card ${discardValue===undefined?"face-down":cardClass(discardValue)} ${discardActionable?"actionable":""} ${showDrawnOnDiscard?"selected":""} ${stockDraw&&state.flipMode?"flip-choice":""}`;discard.disabled=!discardActionable;discard.onclick=canDraw&&s.discardTop?()=>send({action:"draw",source:"discard"}):stockDraw&&!state.flipMode?()=>chooseDiscard(s):null;discardButton.hidden=!stockDraw||state.flipMode;discardButton.textContent=s.canSkip?"Hold last card & discard":"Discard drawn card & flip";discardButton.onclick=()=>chooseDiscard(s)}
    function announceLastTurn(s){clearTimeout(announceLastTurn.timer);const banner=$("#roundEvent"),name=s.seats?.[s.closer]?.name||PLAYER_NAMES[s.closer];banner.hidden=false;banner.classList.remove("show");banner.innerHTML=`LAST TURN<span>${escapeHtml(name)} went out · every other player gets one final turn</span>`;void banner.offsetWidth;banner.classList.add("show");announceLastTurn.timer=setTimeout(()=>{banner.hidden=true;banner.classList.remove("show")},3000)}
    function showHoleScore(s){const last=s.lastHole,winners=s.winnerSeats||[],isFinal=s.phase==="gameover",nameFor=seat=>s.seats[seat].name,title=isFinal?"Round Complete":`Hole ${last.hole} Complete`,summary=isFinal?(winners.length===1?`${nameFor(winners[0])} wins the round!`:`${winners.map(nameFor).join(" and ")} tie for the win!`):`${nameFor(last.closer)} putted out first.`;openModal(`<h2>${title}</h2><p class="modal-summary">${escapeHtml(summary)} Matching vertical cards cancel; bonuses are shown below.</p><div class="summary-grid">${last.results.map(result=>{const holeScore=`${result.score>=0?"+":""}${result.score}`,scoreBlock=isFinal?`<div class="final-score">${last.totals[result.seat]}</div><div class="hole-result">Hole ${last.hole}: ${holeScore}</div>`:`<div class="hole-score">${holeScore}</div><div class="round-total">Round total <strong>${last.totals[result.seat]}</strong></div>`;return `<section class="summary-card"><h3>${escapeHtml(result.name)}</h3>${scoreBlock}${result.bonus?`<div class="bonus">Pair bonus: ${result.bonus}</div>`:""}</section>`}).join("")}</div><div class="modal-actions"><button class="btn primary" id="continueButton">${isFinal?"Play Again":`Deal Hole ${s.hole+1}`}</button></div>`);$("#continueButton").onclick=()=>{closeModal();state.lastHoleShown=isFinal?0:s.hole;send({action:isFinal?"newGame":"nextHole"})}}
    function scheduleHoleScore(s){const key=`${s.phase}:${s.hole}`;if(state.lastHoleShown===s.hole||state.pendingHoleKey===key)return;clearTimeout(state.holeScoreTimer);state.pendingHoleKey=key;state.holeScoreTimer=setTimeout(()=>{const current=state.data;state.pendingHoleKey=null;if(!current||current.hole!==s.hole||!(current.phase==="holeEnd"||current.phase==="gameover")||!current.lastHole)return;state.lastHoleShown=current.hole;showHoleScore(current)},5000)}
    function render(){const s=state.data;if(!s)return;$("#holeValue").textContent=s.hole?`${s.hole} of ${s.finalHole}`:"Waiting";$("#holeDetail").textContent=s.phase==="teeOff"?"Flip any two cards":s.phase==="playing"?s.finalTurns.length?"Final shots":"Play in progress":"Eight cards · two rows of four";$("#turnNote").textContent=s.prompt;$("#newGameButton").textContent=s.phase==="waiting"?"Start Game":"New Game";const waitingTee=s.phase==="teeOff"&&(s.teeOffCounts[state.seat]||0)<2;$("#teeNotice").hidden=!waitingTee;$("#teeNotice").textContent=`Tee off: flip ${2-s.teeOffCounts[state.seat]} card${2-s.teeOffCounts[state.seat]===1?"":"s"} on your board.`;renderScores(s);renderHistory(s);renderAchievements(s);renderPlayers(s);renderCenter(s);if(s.closer===null)state.lastCloser=null;else if(state.lastCloser!==s.closer){state.lastCloser=s.closer;announceLastTurn(s)}if((s.phase==="holeEnd"||s.phase==="gameover")&&s.lastHole)scheduleHoleScore(s)}
    async function joinPlayer(player,displayName){try{const data=await api("/api/join",{method:"POST",body:JSON.stringify({name:player,token:state.token,botLevel:prefs.botLevel,...(displayName?{displayName}:{})})});state.token=data.token;state.seat=data.seat;state.name=data.name;state.data=data.state;localStorage.setItem(SESSION_KEY,JSON.stringify({token:state.token,seat:state.seat,name:state.name}));closeModal();render();startPolling()}catch(error){toast(error.message)}}
    function choosePlayer(){openModal(`<h2>Choose Your Player</h2><p class="modal-summary">Choose a seat, or use its pencil for a different display name. Unclaimed seats are bots.</p><div class="join-grid">${PLAYER_NAMES.map(name=>`<div class="join-seat"><button class="join-choice" data-player="${name}">${name}</button><button class="join-pencil" data-edit="${name}" aria-label="Use ${name}'s seat with another name">✎</button></div>`).join("")}</div>`);document.querySelectorAll("[data-player]").forEach(button=>button.onclick=()=>joinPlayer(button.dataset.player));document.querySelectorAll("[data-edit]").forEach(button=>button.onclick=()=>{const name=prompt(`Name for ${button.dataset.edit}'s seat:`,"");if(name?.trim())joinPlayer(button.dataset.edit,name);else if(name!==null)toast("Enter a player name.")})}
    function showSettings(){const level=state.data?.botLevel||prefs.botLevel;openModal(`<h2>Game Settings</h2><div class="settings-grid"><label class="field">Table theme<select id="themeSetting"><option value="classic" ${prefs.theme==="classic"?"selected":""}>Golf Green</option><option value="blue" ${prefs.theme==="blue"?"selected":""}>Clubhouse Blue</option></select></label><label class="field">Sound effects<select id="soundSetting"><option value="on" ${prefs.sound?"selected":""}>On</option><option value="off" ${!prefs.sound?"selected":""}>Off</option></select></label><label class="field">Bot level<select id="botLevelSetting"><option value="low" ${level==="low"?"selected":""}>Low · casual</option><option value="medium" ${level==="medium"?"selected":""}>Medium · balanced</option><option value="high" ${level==="high"?"selected":""}>High · strategic</option></select></label></div><p class="modal-summary">Bot level applies to every computer player and is remembered on this device.</p><div class="modal-actions"><button class="btn" id="cancelSettings">Cancel</button><button class="btn primary" id="saveSettings">Save</button></div>`);$("#cancelSettings").onclick=closeModal;$("#saveSettings").onclick=async()=>{const next={theme:$("#themeSetting").value,sound:$("#soundSetting").value==="on",botLevel:$("#botLevelSetting").value};if(state.token&&!await send({action:"setBotLevel",level:next.botLevel}))return;Object.assign(prefs,next);localStorage.setItem(PREF_KEY,JSON.stringify(prefs));document.body.dataset.theme=prefs.theme;closeModal();toast(`Settings saved · ${prefs.botLevel} bots.`)}}
    async function poll(){if(!state.token||state.busy)return false;try{const data=await api(`/api/state?token=${encodeURIComponent(state.token)}`);state.data=data.state;render();return true}catch(error){clearInterval(state.poll);clearInterval(state.heartbeat);localStorage.removeItem(SESSION_KEY);state.token=null;state.data=null;choosePlayer();return false}}

    $("#backdrop").onclick=event=>{if(event.target===$("#backdrop"))closeModal()};$("#settingsButton").onclick=showSettings;$("#newGameButton").onclick=()=>state.token?(state.lastHoleShown=0,send({action:"newGame"})):choosePlayer();
    const params=new URLSearchParams(location.search),hashParams=new URLSearchParams(location.hash.replace(/^#\??/,"")),gameNight=params.get("gameNight")||hashParams.get("gameNight")||"https://judd-game-night.onrender.com/";$("#gameNightReturn").onclick=()=>location.assign(gameNight);
    (async()=>{const saved=JSON.parse(localStorage.getItem(SESSION_KEY)||"null");if(saved?.token){state.token=saved.token;state.seat=saved.seat;state.name=saved.name;if(await poll()){startPolling();return}}choosePlayer()})();
