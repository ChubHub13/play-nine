<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172d24">
  <title>Three-Handed Play Nine</title>
  <style>
    :root{--ink:#fff8e8;--muted:#c8c4bd;--gold:#f1c75b;--purple:#351442;--felt:#174c38;--felt2:#0b2d23;--panel:rgba(16,10,21,.91);--line:rgba(241,199,91,.27);--danger:#a84452;--good:#74d8a0}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:#090b0d;color:var(--ink)}body{min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 60% 20%,#265744 0,transparent 38%),linear-gradient(145deg,#0a0a0e,#21102a 58%,#071611)}button,select,input{font:inherit}button{color:inherit;cursor:pointer}button:disabled{opacity:.38;cursor:not-allowed}[hidden]{display:none!important}
    .app{min-height:100vh;display:grid;grid-template-rows:62px minmax(0,1fr)}.topbar{display:flex;align-items:center;gap:12px;padding:7px 16px;border-bottom:1px solid var(--line);background:rgba(8,6,11,.94);box-shadow:0 7px 24px #0007}.brand-mark{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:13px;background:linear-gradient(145deg,#51305e,#201027);font-size:25px}.brand h1{margin:0;color:#ffe39a;font:900 30px/1 Georgia,serif;letter-spacing:.05em}.brand small{display:block;margin-top:4px;color:var(--muted);font-size:10px;font-style:italic}.version{margin-left:6px;color:#a99aa9;font:800 9px Segoe UI,sans-serif;vertical-align:top}.spacer{flex:1}.top-actions{display:flex;gap:6px}
    .btn{min-height:36px;padding:7px 12px;border:1px solid #ffffff2c;border-radius:10px;background:linear-gradient(#482454,#281331);font-weight:900;box-shadow:0 3px 10px #0005}.btn:hover:not(:disabled){filter:brightness(1.14);transform:translateY(-1px)}.btn.small{min-height:32px;padding:6px 10px;font-size:11px}.btn.primary{color:#2a1903;border-color:#ffe395;background:linear-gradient(#ffdc79,#c99026)}.btn.danger{background:linear-gradient(#9b4050,#59212d)}.btn.good{color:#082116;border-color:#a7f1c7;background:linear-gradient(#8be4b3,#45ae77)}
    .layout{min-height:0;display:grid;grid-template-columns:228px minmax(0,1fr);gap:7px;padding:7px}.sidebar{min-height:0;display:flex;flex-direction:column;gap:6px;overflow:auto}.panel{border:1px solid var(--line);border-radius:13px;background:var(--panel);box-shadow:0 7px 22px #0005}.hole-panel{padding:10px;text-align:center}.eyebrow{color:var(--muted);font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.hole-value{margin:2px 0;color:#ffe39a;font:900 24px Georgia,serif}.hole-detail{color:var(--muted);font-size:10px}.scoreboard{padding:9px}.panel-heading{margin:0 0 6px;color:var(--muted);font-size:9px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.score-row{display:grid;grid-template-columns:1fr auto;gap:5px;align-items:center;min-height:29px;padding:3px 5px;border-top:1px solid #ffffff10}.score-name{font-size:11px;font-weight:900}.score-note{display:block;color:var(--muted);font-size:8px;font-weight:500}.score-number{color:#ffe39a;font:900 17px Georgia,serif}
    .all-time{padding:8px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px}.tabs button{padding:6px 2px;border:1px solid #6c4773;border-radius:7px;background:#291330;color:#cbbcc8;font-size:9px;font-weight:900}.tabs button.active{color:#2a1903;border-color:#ffe395;background:linear-gradient(#ffdc79,#c99026)}.all-time-list{margin:6px 0 0;padding:0;list-style:none;counter-reset:rank}.all-time-list li{counter-increment:rank;display:grid;grid-template-columns:16px 1fr auto;gap:3px;padding:3px 1px;border-bottom:1px solid #ffffff10;font-size:10px;font-weight:800}.all-time-list li:before{content:counter(rank) ".";color:var(--gold)}.all-time-list li.empty{display:block;color:var(--muted);text-align:center;font-weight:500}.all-time-list li.empty:before{display:none}.history{padding:8px;max-height:120px;overflow:auto}.history-row{display:grid;grid-template-columns:35px repeat(3,1fr);gap:3px;padding:3px 0;border-top:1px solid #ffffff10;color:var(--muted);font-size:9px;text-align:center}.history-row strong{color:var(--ink)}.side-actions{display:grid;grid-template-columns:1fr;gap:5px}.notice{padding:7px;border:1px solid var(--line);border-radius:9px;background:#42281766;color:#ffe0a0;font-size:9px;text-align:center;line-height:1.35}
    .table{position:relative;min-height:650px;overflow:hidden;border:7px solid #30153a;border-radius:34px;background:radial-gradient(ellipse at 50% 48%,#27705455,transparent 48%),repeating-linear-gradient(115deg,#174c38 0,#174c38 2px,#143f31 2px,#143f31 5px);box-shadow:inset 0 0 55px #001c14aa,0 12px 35px #0007}.table:before{content:"PLAY NINE";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff1b50c;font:900 clamp(45px,9vw,110px) Georgia,serif;white-space:nowrap}.turn-note{position:absolute;z-index:8;left:50%;top:8px;transform:translateX(-50%);max-width:60%;padding:6px 11px;border:1px solid var(--line);border-radius:99px;background:#100a15dd;color:#ffefbd;font-size:10px;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .player-area{position:absolute;z-index:3;width:274px}.player-area.p0{left:50%;bottom:10px;width:411px;transform:translateX(-50%)}.player-area.p1{left:13px;top:45px}.player-area.p2{right:13px;top:45px}.player-chip{display:flex;align-items:center;gap:7px;width:max-content;max-width:100%;margin:0 auto 5px;padding:4px 8px;border:1px solid #ffffff25;border-radius:11px;background:#0d0911e8;box-shadow:0 4px 12px #0007}.player-area.active .player-chip{border-color:var(--gold);box-shadow:0 0 0 2px #f1c75b33,0 4px 12px #0007}.player-area.closer .player-chip{border-color:var(--good)}.avatar{width:29px;height:29px;border:2px solid #deb44e;border-radius:50%;object-fit:cover;background:#deb44e}.player-copy{min-width:0}.player-name{font-size:10px;font-weight:900;white-space:nowrap}.player-detail{color:var(--muted);font-size:8px}.name-edit{display:inline-grid;place-items:center;width:16px;height:16px;margin-left:3px;padding:0;border:0;border-radius:50%;background:#ffffff20;color:#ffe39a;font:900 11px/1 system-ui}.name-edit:hover{background:#ffe39a44}
    .golf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border:1px solid #ffffff22;border-radius:13px;background:#09231cbb;box-shadow:0 5px 15px #00150f99}.golf-card{position:relative;aspect-ratio:.72;min-width:0;padding:0;border:2px solid #e7dfca;border-radius:8px;background:linear-gradient(145deg,#fffdf4,#dcd5c4);color:#28242b;box-shadow:2px 3px 0 #06110e88;overflow:hidden}.golf-card:disabled{opacity:1}.golf-card.face-down{border-color:#e5c25f;background:repeating-linear-gradient(45deg,#492058 0,#492058 5px,#33153e 5px,#33153e 10px);color:#f5d775}.golf-card.face-down:after{content:"●";display:grid;place-items:center;position:absolute;inset:21%;border:2px solid currentColor;border-radius:50%;font-size:10px}.golf-card.actionable:hover{transform:translateY(-4px);outline:3px solid #ffe079;outline-offset:1px}.golf-card.flip-target{animation:pulse 1s ease-in-out infinite alternate;outline:3px solid #79e5a9}.golf-card.matched{border-color:#86e7ae;box-shadow:0 0 0 2px #3fc07877}.card-value{position:absolute;inset:0;display:grid;place-items:center;font:900 clamp(18px,3vw,31px) Georgia,serif;text-align:center}.card-label{position:absolute;left:0;right:0;bottom:4px;color:#756b62;font-size:6px;font-weight:1000;letter-spacing:.08em;text-align:center}.golf-card.ace{color:#257a4c;background:linear-gradient(#f4fff8,#cdebd9)}.golf-card.zero{color:#286696;background:linear-gradient(#f5fbff,#d5e7f1)}.golf-card.bad{color:#a02f3d;background:linear-gradient(#fff8f2,#efd2cc)}
    .center{position:absolute;z-index:5;left:50%;top:37%;transform:translate(-50%,-50%);display:grid;grid-template-columns:90px 90px;gap:16px;align-items:start}.pile-wrap{text-align:center}.pile{position:relative;width:70px;aspect-ratio:.72;margin:auto;padding:0;border:0;background:none}.pile:disabled{opacity:1}.pile.golf-card{border:2px solid #e7dfca;background:linear-gradient(145deg,#fffdf4,#dcd5c4);color:#28242b;box-shadow:2px 3px 0 #06110e88}.pile.golf-card.ace{color:#257a4c;background:linear-gradient(#f4fff8,#cdebd9)}.pile.golf-card.zero{color:#286696;background:linear-gradient(#f5fbff,#d5e7f1)}.pile.golf-card.bad{color:#a02f3d;background:linear-gradient(#fff8f2,#efd2cc)}.pile.golf-card.face-down{border-color:#e5c25f;background:repeating-linear-gradient(45deg,#492058 0,#492058 5px,#33153e 5px,#33153e 10px);color:#f5d775}.pile.actionable:hover{transform:translateY(-5px)}.pile.selected{outline:4px solid #ffe079;outline-offset:4px;filter:brightness(1.12);animation:selectedPulse .8s ease-in-out infinite alternate}.pile.flip-choice{outline-color:#79e5a9}.pile-label{margin-top:8px;color:#d5cbc2;font-size:8px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.pile-back{position:absolute;inset:0;display:grid;place-items:center;border:4px solid #f0cd70;border-radius:10px;background:repeating-linear-gradient(45deg,#482056 0,#482056 6px,#2c1235 6px,#2c1235 12px);color:#f4d878;box-shadow:3px 5px 0 #00150f;font:900 23px Georgia,serif}.pile-count{position:absolute;right:-8px;bottom:-7px;min-width:23px;padding:4px;border-radius:99px;background:var(--gold);color:#251404;font-size:9px;font-weight:900}.skip-shot{grid-column:1/-1;justify-self:center;min-height:27px;padding:4px 9px;font-size:8px}@keyframes pulse{to{filter:brightness(1.3);transform:translateY(-2px)}}@keyframes selectedPulse{to{outline-color:#fff3b3;box-shadow:0 0 20px #f1c75b99}}
    .backdrop{position:fixed;z-index:50;inset:0;display:grid;place-items:center;padding:10px;background:#030406dc;opacity:0;pointer-events:none;transition:.15s}.backdrop.open{opacity:1;pointer-events:auto}.modal{width:min(760px,calc(100vw - 20px));max-height:calc(100vh - 20px);overflow:auto;padding:18px;border:1px solid #f1c75b66;border-radius:18px;background:linear-gradient(145deg,#281031,#100815);box-shadow:0 20px 70px #000}.modal h2{margin:0 0 8px;color:#ffe39a;font:900 28px Georgia,serif;text-align:center}.modal-summary{margin:0 0 12px;color:var(--muted);font-size:11px;line-height:1.45;text-align:center}.join-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.join-seat{position:relative}.join-choice{width:100%;min-height:78px;padding:18px 32px 18px 8px;border:1px solid #955978;border-radius:13px;background:#41194c;color:#fff0a4;font:900 21px Georgia,serif}.join-pencil{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:25px;height:25px;padding:0;border:0;border-radius:6px;background:transparent;color:#ffe39a;font-weight:900}.join-pencil:hover{background:#ffffff20}.modal-actions{display:flex;justify-content:center;gap:7px;margin-top:14px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:grid;gap:4px;color:var(--muted);font-size:10px;font-weight:900}.field select{padding:8px;border:1px solid #ffffff24;border-radius:8px;background:#25112d;color:var(--ink)}.reset-scores{grid-column:1/-1}.rules{color:#eee2d2;font-size:11px;line-height:1.5}.rules li{margin:6px 0}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.summary-card{padding:9px;border:1px solid #ffffff18;border-radius:11px;background:#0003;text-align:center}.summary-card h3{margin:0;color:#ffe39a;font-size:13px}.hole-score{margin:5px 0;font:900 29px Georgia,serif}.total{color:var(--muted);font-size:9px}.bonus{margin-top:4px;color:#81e2aa;font-size:8px;font-weight:900}.toast{position:fixed;z-index:80;left:50%;bottom:58px;transform:translateX(-50%);display:none;padding:9px 13px;border-radius:9px;background:#9c3c4b;color:#fff;font-size:11px;font-weight:800}.toast.show{display:block}.return{position:fixed;z-index:20;right:13px;bottom:12px;border-radius:99px}
    body[data-theme="blue"]{--felt:#17405b;--felt2:#0b293d;--purple:#182e51}.empty{padding:6px;color:var(--muted);font-size:9px;text-align:center}
    @media(max-width:900px){.layout{grid-template-columns:190px minmax(0,1fr)}.table{min-height:650px}.player-area{width:226px}.player-area.p0{width:339px}.player-area.p1{left:6px}.player-area.p2{right:6px}.center{top:37%}}
    @media(max-width:700px){.app{grid-template-rows:52px auto}.topbar{padding:5px 8px}.brand-mark{display:none}.brand h1{font-size:23px}.brand small{display:none}.layout{display:block;padding:4px}.sidebar{display:grid;grid-template-columns:1fr 1fr;margin-bottom:5px}.history{display:none}.side-actions{grid-column:1/-1}.table{min-height:680px;border-width:4px}.player-area{width:46%}.player-area.p1{top:43px}.player-area.p2{top:43px}.player-area.p0{width:69%;bottom:8px}.golf-grid{gap:2px;padding:4px}.player-chip{padding:3px 5px}.center{top:38%;gap:7px;grid-template-columns:75px 75px}.pile{width:56px}.turn-note{max-width:88%}.summary-grid,.join-grid{grid-template-columns:1fr}.settings-grid{grid-template-columns:1fr}.reset-scores{grid-column:1}.return{right:7px;bottom:7px}}
  </style>
</head>
<body data-theme="classic">
  <main class="app">
    <header class="topbar"><div class="brand-mark">⛳</div><div class="brand"><h1>PLAY NINE <span class="version">v1.2.0</span></h1><small>Three players · nine holes · lowest score wins</small></div><i class="spacer"></i><div class="top-actions"><button class="btn small" id="rulesButton">Rules</button><button class="btn small" id="settingsButton">Settings</button></div></header>
    <div class="layout">
      <aside class="sidebar">
        <section class="panel hole-panel"><div class="eyebrow">Hole</div><div class="hole-value" id="holeValue">Waiting</div><div class="hole-detail" id="holeDetail">Eight cards · two rows of four</div></section>
        <section class="panel scoreboard"><div class="panel-heading">Score · low wins</div><div id="scoreRows"></div></section>
        <section class="panel all-time"><div class="tabs"><button type="button" data-tab="high">High Scores</button><button type="button" data-tab="low">Low Scores</button></div><ol class="all-time-list" id="allTimeScores"></ol></section>
        <section class="panel history"><div class="panel-heading">Scorecard</div><div id="historyRows"><div class="empty">No holes scored.</div></div></section>
        <div class="side-actions"><button class="btn danger" id="newGameButton">Start Game</button><div class="notice" id="teeNotice" hidden></div></div>
      </aside>
      <section class="table">
        <div class="turn-note" id="turnNote">Choose a player to begin.</div>
        <div class="player-area p1" id="area1"><div class="player-chip"><img class="avatar" src="/cristi-avatar.png" alt="Cristi"><div class="player-copy"><div class="player-name">Cristi<button class="name-edit" id="editName1" type="button" hidden>✎</button></div><div class="player-detail" id="detail1">Waiting</div></div></div><div class="golf-grid" id="board1"></div></div>
        <div class="player-area p2" id="area2"><div class="player-chip"><img class="avatar" src="/cindy-avatar.png" alt="Cindy"><div class="player-copy"><div class="player-name">Cindy<button class="name-edit" id="editName2" type="button" hidden>✎</button></div><div class="player-detail" id="detail2">Waiting</div></div></div><div class="golf-grid" id="board2"></div></div>
        <div class="center"><div class="pile-wrap"><button class="pile" id="stockPile"><span class="pile-back">⛳</span><span class="pile-count" id="stockCount">0</span></button><div class="pile-label">Draw pile</div></div><div class="pile-wrap"><button class="pile" id="discardPile"></button><div class="pile-label">Discard</div></div><button class="btn skip-shot" id="skipButton" hidden>Skip final putt</button></div>
        <div class="player-area p0" id="area0"><div class="player-chip"><img class="avatar" src="/daryl-avatar.png" alt="Daryl"><div class="player-copy"><div class="player-name">Daryl<button class="name-edit" id="editName0" type="button" hidden>✎</button></div><div class="player-detail" id="detail0">Waiting</div></div></div><div class="golf-grid" id="board0"></div></div>
      </section>
    </div>
  </main>
  <div class="backdrop" id="backdrop"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div><button class="btn return" id="gameNightReturn">← Game Night</button>
  <script>
    const PLAYER_NAMES=["Daryl","Cristi","Cindy"],SESSION_KEY="playNineSession",PREF_KEY="playNinePreferences";
    const API=location.protocol==="file:"?"http://127.0.0.1:8080":"";
    const state={token:null,seat:-1,name:null,data:null,poll:null,heartbeat:null,busy:false,tab:"low",flipMode:false,lastHoleShown:0};
    const prefs=Object.assign({theme:"classic",sound:true},JSON.parse(localStorage.getItem(PREF_KEY)||"null")||{});document.body.dataset.theme=prefs.theme;
    const $=selector=>document.querySelector(selector),escapeHtml=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    function toast(message){const el=$("#toast");el.textContent=message;el.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove("show"),1900)}
    function openModal(html){$("#modal").innerHTML=html;$("#backdrop").classList.add("open")}function closeModal(){$("#backdrop").classList.remove("open");$("#modal").innerHTML=""}
    async function api(path,options={}){const response=await fetch(API+path,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}}),data=await response.json();if(!response.ok||data.ok===false)throw new Error(data.message||"Request failed");return data}
    async function send(action){if(state.busy)return false;state.busy=true;try{const data=await api("/api/action",{method:"POST",body:JSON.stringify({token:state.token,...action})});state.data=data.state;state.flipMode=false;render();return true}catch(error){toast(error.message);return false}finally{state.busy=false}}
    function valueLabel(value){return value===-5?"HOLE IN ONE":value===0?"MULLIGAN":value===12?"OUT OF BOUNDS":"STROKES"}
    function cardClass(value){return value===-5?"ace":value===0?"zero":value>=10?"bad":""}
    function faceCard(value,mini=false){return `<span class="${mini?"drawn-mini":"card-value"} ${cardClass(value)}">${value}</span>${mini?"":`<span class="card-label">${valueLabel(value)}</span>`}`}
    function renderScores(s){$("#scoreRows").innerHTML=s.seats.map((player,seat)=>`<div class="score-row"><div class="score-name">${escapeHtml(player.name)}<span class="score-note">${player.bot?"Bot":player.connected?"Live":"Waiting"}</span></div><div class="score-number">${s.totals[seat]}</div></div>`).join("")}
    function renderAllTime(s){document.querySelectorAll("[data-tab]").forEach(button=>button.classList.toggle("active",button.dataset.tab===state.tab));const scores=s.allTime?.[state.tab]||[];$("#allTimeScores").innerHTML=scores.length?scores.map(entry=>`<li><span>${escapeHtml(entry.name)}${entry.bot?" (Bot)":""}</span><strong>${entry.score}</strong></li>`).join(""):'<li class="empty">No completed games yet</li>'}
    function renderHistory(s){$("#historyRows").innerHTML=s.holeHistory?.length?s.holeHistory.map(hole=>`<div class="history-row"><strong>H${hole.hole}</strong>${hole.results.map(result=>`<span>${result.score>=0?"+":""}${result.score}<br><strong>${hole.totals[result.seat]}</strong></span>`).join("")}</div>`).join(""):'<div class="empty">No holes scored.</div>'}
    function editName(current){const name=prompt("Name for this game:",current);if(name===null)return;if(!name.trim())return toast("Enter a player name.");send({action:"rename",name})}
    function renderBoard(s,seat){const board=s.boards[seat]||[],result=s.lastHole?.results?.[seat],matched=new Set(result?.matchedColumns||[]),canTee=s.phase==="teeOff"&&seat===state.seat&&(s.teeOffCounts[seat]||0)<2,canPlay=s.phase==="playing"&&s.turn===state.seat&&s.stage==="play"&&seat===state.seat;$("#board"+seat).innerHTML=board.map((slot,index)=>{const actionable=(canTee&&!slot.faceUp)||(canPlay&&(!state.flipMode||!slot.faceUp)),classes=["golf-card",slot.faceUp?cardClass(slot.value):"face-down",actionable?"actionable":"",state.flipMode&&canPlay&&!slot.faceUp?"flip-target":"",slot.faceUp&&matched.has(index%4)?"matched":""].filter(Boolean).join(" ");return `<button class="${classes}" data-index="${index}" ${actionable?"":"disabled"}>${slot.faceUp?faceCard(slot.value):""}</button>`}).join("");$("#board"+seat).querySelectorAll("button.actionable").forEach(button=>button.onclick=()=>{const index=Number(button.dataset.index);if(canTee)return send({action:"teeOff",index});send({action:state.flipMode?"discardFlip":"replace",index})})}
    function renderPlayers(s){for(let seat=0;seat<3;seat++){const info=s.seats[seat],area=$("#area"+seat),nameNode=area.querySelector(".player-name"),edit=$("#editName"+seat);nameNode.firstChild.nodeValue=info.name;area.querySelector(".avatar").alt=info.name;edit.hidden=seat!==state.seat;edit.setAttribute("aria-label",`Edit ${info.name}'s name`);edit.onclick=()=>editName(info.name);area.classList.toggle("active",s.phase==="playing"&&s.turn===seat);area.classList.toggle("closer",s.closer===seat);$("#detail"+seat).textContent=s.closer===seat?"PUTTED OUT":s.phase==="teeOff"?`${s.teeOffCounts[seat]}/2 cards flipped`:`${info.bot?"Bot":info.connected?"Live":"Waiting"} · ${s.totals[seat]} total`;renderBoard(s,seat)}}
    function renderCenter(s){const stock=$("#stockPile"),discard=$("#discardPile"),skip=$("#skipButton"),canDraw=s.phase==="playing"&&s.turn===state.seat&&s.stage==="draw",ownTurn=s.phase==="playing"&&s.turn===state.seat&&s.stage==="play",stockDraw=ownTurn&&s.drawn?.source==="stock",discardDraw=ownTurn&&s.drawn?.source==="discard",showDrawnOnStock=stockDraw&&!state.flipMode,showDrawnOnDiscard=discardDraw||(stockDraw&&state.flipMode),stockValue=showDrawnOnStock?s.drawn.card.value:null,discardValue=showDrawnOnDiscard?s.drawn.card.value:s.discardTop?.value;stock.innerHTML=stockValue!==null?`${faceCard(stockValue)}<span class="pile-count">${s.stockCount}</span>`:`<span class="pile-back">⛳</span><span class="pile-count">${s.stockCount}</span>`;stock.className=`pile ${stockValue!==null?`golf-card ${cardClass(stockValue)} selected`:""} ${canDraw?"actionable":""}`;stock.disabled=!canDraw;stock.onclick=canDraw?()=>send({action:"draw",source:"stock"}):null;discard.innerHTML=discardValue===undefined?"":faceCard(discardValue);discard.className=`pile golf-card ${discardValue===undefined?"face-down":cardClass(discardValue)} ${canDraw&&s.discardTop?"actionable":""} ${showDrawnOnDiscard?"selected":""} ${stockDraw&&state.flipMode?"flip-choice":""}`;const canChooseDiscard=stockDraw;discard.disabled=!(canDraw&&s.discardTop)&&!canChooseDiscard;discard.onclick=canDraw&&s.discardTop?()=>send({action:"draw",source:"discard"}):canChooseDiscard?()=>{state.flipMode=!state.flipMode;render()}:null;skip.hidden=!(stockDraw&&s.canSkip);skip.onclick=stockDraw&&s.canSkip?()=>send({action:"skip"}):null}
    function showHoleScore(s){const last=s.lastHole,winners=s.winnerSeats||[],nameFor=seat=>s.seats[seat].name,title=s.phase==="gameover"?"Round Complete":`Hole ${last.hole} Complete`,summary=s.phase==="gameover"?(winners.length===1?`${nameFor(winners[0])} wins the round!`:`${winners.map(nameFor).join(" and ")} tie for the win!`):`${nameFor(last.closer)} putted out first.`;openModal(`<h2>${title}</h2><p class="modal-summary">${escapeHtml(summary)} Matching vertical cards cancel; bonuses are shown below.</p><div class="summary-grid">${last.results.map(result=>`<section class="summary-card"><h3>${escapeHtml(result.name)}</h3><div class="hole-score">${result.score>=0?"+":""}${result.score}</div><div class="total">Round total: ${last.totals[result.seat]}</div>${result.bonus?`<div class="bonus">Pair bonus: ${result.bonus}</div>`:""}</section>`).join("")}</div><div class="modal-actions"><button class="btn primary" id="continueButton">${s.phase==="gameover"?"Play Again":`Deal Hole ${s.hole+1}`}</button></div>`);$("#continueButton").onclick=()=>{closeModal();state.lastHoleShown=s.phase==="gameover"?0:s.hole;send({action:s.phase==="gameover"?"newGame":"nextHole"})}}
    function render(){const s=state.data;if(!s)return;$("#holeValue").textContent=s.hole?`${s.hole} of ${s.finalHole}`:"Waiting";$("#holeDetail").textContent=s.phase==="teeOff"?"Flip any two cards":s.phase==="playing"?s.finalTurns.length?"Final shots":"Play in progress":"Eight cards · two rows of four";$("#turnNote").textContent=s.prompt;$("#newGameButton").textContent=s.phase==="waiting"?"Start Game":"New Game";const waitingTee=s.phase==="teeOff"&&(s.teeOffCounts[state.seat]||0)<2;$("#teeNotice").hidden=!waitingTee;$("#teeNotice").textContent=`Tee off: flip ${2-s.teeOffCounts[state.seat]} card${2-s.teeOffCounts[state.seat]===1?"":"s"} on your board.`;renderScores(s);renderAllTime(s);renderHistory(s);renderPlayers(s);renderCenter(s);if((s.phase==="holeEnd"||s.phase==="gameover")&&s.lastHole&&state.lastHoleShown!==s.hole){state.lastHoleShown=s.hole;showHoleScore(s)}}
    async function joinPlayer(player,displayName){try{const data=await api("/api/join",{method:"POST",body:JSON.stringify({name:player,token:state.token,...(displayName?{displayName}:{})})});state.token=data.token;state.seat=data.seat;state.name=data.name;state.data=data.state;localStorage.setItem(SESSION_KEY,JSON.stringify({token:state.token,seat:state.seat,name:state.name}));closeModal();render();startPolling()}catch(error){toast(error.message)}}
    function choosePlayer(){openModal(`<h2>Choose Your Player</h2><p class="modal-summary">Choose a seat, or use its pencil for a different display name. Unclaimed seats are bots.</p><div class="join-grid">${PLAYER_NAMES.map(name=>`<div class="join-seat"><button class="join-choice" data-player="${name}">${name}</button><button class="join-pencil" data-edit="${name}" aria-label="Use ${name}'s seat with another name">✎</button></div>`).join("")}</div>`);document.querySelectorAll("[data-player]").forEach(button=>button.onclick=()=>joinPlayer(button.dataset.player));document.querySelectorAll("[data-edit]").forEach(button=>button.onclick=()=>{const name=prompt(`Name for ${button.dataset.edit}'s seat:`,"");if(name?.trim())joinPlayer(button.dataset.edit,name);else if(name!==null)toast("Enter a player name.")})}
    function showRules(){openModal(`<h2>How to Play</h2><ol class="rules"><li>Each hole begins with eight facedown cards in two rows of four. Flip any two cards to tee off.</li><li>On every turn, draw from the deck or discard pile. Replace any one of your cards with the draw. A deck draw may instead be discarded, then one facedown card is flipped.</li><li>With exactly one facedown card, you may draw from the deck and discard it to skip while lining up your final putt.</li><li>When someone reveals all eight cards, everyone else gets one last shot. Remaining cards are then revealed.</li><li>Vertical matching pairs score zero, except −5 Hole-in-One pairs retain their values. Two, three, or four matching pair-columns of the same value earn −10, −15, or −20.</li><li>After nine holes, the lowest total score wins.</li></ol><div class="modal-actions"><button class="btn primary" id="closeRules">Return to Game</button></div>`);$("#closeRules").onclick=closeModal}
    function showSettings(){openModal(`<h2>Game Settings</h2><div class="settings-grid"><label class="field">Table theme<select id="themeSetting"><option value="classic" ${prefs.theme==="classic"?"selected":""}>Golf Green</option><option value="blue" ${prefs.theme==="blue"?"selected":""}>Clubhouse Blue</option></select></label><label class="field">Sound effects<select id="soundSetting"><option value="on" ${prefs.sound?"selected":""}>On</option><option value="off" ${!prefs.sound?"selected":""}>Off</option></select></label><button class="btn danger reset-scores" id="resetScores">Reset High &amp; Low Scores</button></div><div class="modal-actions"><button class="btn" id="cancelSettings">Cancel</button><button class="btn primary" id="saveSettings">Save</button></div>`);$("#cancelSettings").onclick=closeModal;$("#saveSettings").onclick=()=>{prefs.theme=$("#themeSetting").value;prefs.sound=$("#soundSetting").value==="on";localStorage.setItem(PREF_KEY,JSON.stringify(prefs));document.body.dataset.theme=prefs.theme;closeModal();toast("Settings saved.")};$("#resetScores").onclick=async()=>{if(!confirm("Reset every High Score and Low Score entry? This cannot be undone."))return;if(await send({action:"resetScores"})){closeModal();toast("High and low scores reset.")}}}
    async function poll(){if(!state.token||state.busy)return false;try{const data=await api(`/api/state?token=${encodeURIComponent(state.token)}`);state.data=data.state;render();return true}catch(error){clearInterval(state.poll);clearInterval(state.heartbeat);localStorage.removeItem(SESSION_KEY);state.token=null;state.data=null;choosePlayer();return false}}
    async function heartbeat(){if(!state.token)return;try{await api("/api/heartbeat",{method:"POST",body:JSON.stringify({token:state.token})})}catch{}}
    function startPolling(){clearInterval(state.poll);clearInterval(state.heartbeat);state.poll=setInterval(poll,650);state.heartbeat=setInterval(heartbeat,3500)}
    document.querySelectorAll("[data-tab]").forEach(button=>button.onclick=()=>{state.tab=button.dataset.tab;render()});$("#backdrop").onclick=event=>{if(event.target===$("#backdrop"))closeModal()};$("#rulesButton").onclick=showRules;$("#settingsButton").onclick=showSettings;$("#newGameButton").onclick=()=>state.token?(state.lastHoleShown=0,send({action:"newGame"})):choosePlayer();
    const params=new URLSearchParams(location.search),hashParams=new URLSearchParams(location.hash.replace(/^#\??/,"")),gameNight=params.get("gameNight")||hashParams.get("gameNight")||"https://judd-game-night.onrender.com/";$("#gameNightReturn").onclick=()=>location.assign(gameNight);
    (async()=>{const saved=JSON.parse(localStorage.getItem(SESSION_KEY)||"null");if(saved?.token){state.token=saved.token;state.seat=saved.seat;state.name=saved.name;if(await poll()){startPolling();return}}choosePlayer()})();
  </script>
